[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-use"
version = "0.1.0"
description = "browser-use, but for the entire desktop — give any AI Agent eyes and hands on Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyautogui",
    "uiautomation",
    "mss",
    "mcp[cli]>=2.3,<3",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "openai",
    "ollama",
    "pillow",
    "pyperclip",
    "prompt_toolkit>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest"]
desktop = ["pywebview>=6,<7", "pythonnet>=3.0,<3.1; sys_platform == 'win32'"]

[project.scripts]
screen-use-mcp = "screen_use.mcp_server:main"
windows-agent-mcp = "windows_agent.mcp_server:main"
windows-agent-ui = "windows_agent.web.server:main"

[project.gui-scripts]
windows-agent-desktop = "windows_agent.desktop:main"

[tool.setuptools]
py-modules = ["desktop_agent"]

[tool.setuptools.packages.find]
include = ["screen_use*", "windows_agent*"]

[tool.setuptools.package-data]
"windows_agent.web" = ["static/*.html", "static/*.css", "static/*.js"]
